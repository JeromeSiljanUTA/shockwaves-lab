services:
    # ------------------------------------------------------------------
    # SearXNG — metasearch engine used by Firecrawl and coding agents
    # ------------------------------------------------------------------
    searxng:
      image: docker.io/searxng/searxng:latest

      ports:
        - "8888:8080"

      volumes:
        - ../../volumes/searxng/config:/etc/searxng:rw

      environment:
        - SEARXNG_BASE_URL=http://searxng.nemesis.home.arpa/
        - SEARXNG_REDIS_URL=redis://searxng-redis:6379/0

      depends_on:
        - searxng-redis

      cap_drop:
        - ALL
      cap_add:
        - CHOWN
        - SETGID
        - SETUID

      logging:
        driver: json-file
        options:
          max-size: "1m"
          max-file: "1"

      restart: unless-stopped

    searxng-redis:
      image: docker.io/valkey/valkey:8-alpine

      command: valkey-server --save 30 1 --loglevel warning

      volumes:
        - ../../volumes/searxng/redis:/data

      restart: unless-stopped

    # ------------------------------------------------------------------
    # Firecrawl — crawl/scrape API used by coding agents
    # ------------------------------------------------------------------
    firecrawl-api:
      image: ghcr.io/firecrawl/firecrawl:latest

      ports:
        - "3002:3002"

      command: node dist/src/harness.js --start-docker

      environment:
        - HOST=0.0.0.0
        - PORT=3002
        - ENV=local
        - REDIS_URL=redis://firecrawl-redis:6379
        - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
        - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
        - NUQ_RABBITMQ_URL=amqp://firecrawl-rabbitmq:5672
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        - POSTGRES_DB=${POSTGRES_DB:-postgres}
        - POSTGRES_HOST=firecrawl-postgres
        - POSTGRES_PORT=5432
        - USE_DB_AUTHENTICATION=false
        # SearXNG runs in this same compose project network
        - SEARXNG_ENDPOINT=http://searxng:8080/search

      env_file:
        - ../../volumes/secrets/firecrawl/secrets.env

      depends_on:
        firecrawl-redis:
          condition: service_started
        firecrawl-playwright:
          condition: service_started
        firecrawl-rabbitmq:
          condition: service_healthy
        firecrawl-postgres:
          condition: service_healthy

      ulimits:
        nofile:
          soft: 65535
          hard: 65535

      restart: unless-stopped

    firecrawl-playwright:
      image: ghcr.io/firecrawl/playwright-service:latest

      environment:
        - PORT=3000

      security_opt:
        - no-new-privileges:true

      restart: unless-stopped

    firecrawl-redis:
      image: docker.io/redis:7-alpine

      command: redis-server --bind 0.0.0.0

      volumes:
        - ../../volumes/firecrawl/redis:/data

      restart: unless-stopped

    firecrawl-rabbitmq:
      image: docker.io/rabbitmq:3-management

      command: rabbitmq-server

      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
        interval: 5s
        timeout: 5s
        retries: 3
        start_period: 5s

      restart: unless-stopped

    firecrawl-postgres:
      image: ghcr.io/firecrawl/nuq-postgres:latest

      environment:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        - POSTGRES_DB=${POSTGRES_DB:-postgres}

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 5s

      volumes:
        - ../../volumes/firecrawl/postgres:/var/lib/postgresql/data

      restart: unless-stopped
