services:
    mosquitto:
      image: eclipse-mosquitto:2
      container_name: mosquitto

      ports:
        - "8030:1883"
        - "8031:8883"
        - "8032:9001"

      volumes:
        - ../../volumes/mosquitto/config:/mosquitto/config
        - ../../volumes/mosquitto/data:/mosquitto/data
        - ../../volumes/mosquitto/logs:/mosquitto/log

      environment:
        - TZ=America/Chicago

      restart: unless-stopped
