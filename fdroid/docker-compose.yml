services:
    fdroid:
      image: austozi/fdroidserver:latest
      container_name: fdroid

      environment:
        - TZ=Europe/London
        - FDROID_UPDATE_INTERVAL=15m
        - FDROID_REPO_URL=http://fdroid.nemesis.home.arpa/fdroid/repo
        - FDROID_REPO_NAME=Jerome's Local F-Droid Repo
        - FDROID_REPO_DESCRIPTION=Apps built by Jerome, served from NEMESIS.

      entrypoint:
        - sh
        - -ceu
        - |
          if [ ! -f /fdroid/config.yml ]; then
            fdroid init --no-prompt
          fi
          sed -i '/^repo_url:/d; /^repo_name:/d; /^repo_description:/d; /^repo_icon:/d' /fdroid/config.yml
          {
            echo "repo_url: $$FDROID_REPO_URL"
            echo "repo_name: $$FDROID_REPO_NAME"
            echo "repo_description: $$FDROID_REPO_DESCRIPTION"
          } >> /fdroid/config.yml
          while :; do
            for f in /updates-scripts/*.sh; do
              [ -f "$$f" ] && bash "$$f"
            done
            fdroid update -c
            sleep "$$FDROID_UPDATE_INTERVAL"
          done

      volumes:
        - ../../volumes/fdroid:/fdroid
        - ../../volumes/fdroid/updates:/updates
        - ./update-scripts:/updates-scripts:ro

      restart: always

    webserver:
      image: nginx:alpine
      container_name: fdroid-webserver

      ports:
        - "8090:80"

      volumes:
        - ../../volumes/fdroid/repo:/usr/share/nginx/html:ro

      restart: always

    upload:
      image: svenstaro/miniserve:latest

      ports:
        - "8091:8080"

      command:
        - --upload-files
        - --disable-indexing
        - --on-duplicate-files=overwrite
        - /updates

      volumes:
        - ../../volumes/fdroid/updates:/updates

      restart: always
