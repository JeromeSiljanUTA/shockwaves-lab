services:
    fdroid:
      image: austozi/fdroidserver:latest
      container_name: fdroid

      environment:
        - TZ=Europe/London
        - FDROID_UPDATE_INTERVAL=15m
        - FDROID_REPO_URL=http://fdroid.nemesis.home.arpa/fdroid/repo
        - FDROID_REPO_NAME=Jerome's Local F-Droid Repo
        - FDROID_REPO_DESCRIPTION=Apps built by Jerome, served from NEMESIS.

      volumes:
        - ../../volumes/fdroid:/fdroid
        - ../../volumes/fdroid/updates:/updates
        - ./update-scripts:/update-scripts:ro

      restart: always

    webserver:
      image: nginx:alpine
      container_name: fdroid-webserver

      ports:
        - "8090:80"

      volumes:
        - ../../volumes/fdroid/repo:/usr/share/nginx/html:ro

      restart: always

    upload:
      image: svenstaro/miniserve:latest

      ports:
        - "8091:8080"

      command:
        - --upload-files
        - --disable-indexing
        - --on-duplicate-files=overwrite
        - /updates

      env_file:
        - ../../volumes/secrets/fdroid/secrets.env

      volumes:
        - ../../volumes/fdroid/updates:/updates

      restart: always
