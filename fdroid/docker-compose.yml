services:
    init:
      image: austozi/fdroidserver:latest
      container_name: fdroid-init

      entrypoint: ["sh", "-c"]
      command:
        - |
          if ! grep -q repo_keyalias /fdroid/config.yml 2>/dev/null; then
            rm -f /fdroid/config.yml /fdroid/keystore.p12
            fdroid init --no-prompt
          fi
          sed -i '/^repo_url:/d; /^repo_name:/d; /^repo_description:/d; /^repo_icon:/d' /fdroid/config.yml
          cat >> /fdroid/config.yml <<'EOF'
          repo_url: http://fdroid.nemesis.home.arpa/fdroid/repo
          repo_name: Jerome's Local F-Droid Repo
          repo_description: Apps built by Jerome, served from NEMESIS.
          EOF

      volumes:
        - ../../volumes/fdroid:/fdroid

    fdroid:
      image: austozi/fdroidserver:latest
      container_name: fdroid

      depends_on:
        init:
          condition: service_completed_successfully

      ports:
        - "8090:8080"

      environment:
        - TZ=Europe/London
        - FDROID_UPDATE_INTERVAL=6h

      volumes:
        - ../../volumes/fdroid:/fdroid
        - ../../volumes/fdroid/updates:/updates

      restart: always

    upload:
      image: svenstaro/miniserve:latest

      ports:
        - "8091:8080"

      command:
        - --upload-files
        - --disable-indexing
        - --on-duplicate-files=overwrite
        - /updates

      env_file:
        - ../../volumes/secrets/fdroid/secrets.env

      volumes:
        - ../../volumes/fdroid/updates:/updates

      restart: always
