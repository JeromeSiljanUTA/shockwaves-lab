limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

log_format authlog '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

access_log /var/log/nginx/auth.log authlog;
error_log /var/log/nginx/error.log warn;

server {
    listen 8099;

    root /var/www;

    location = /blog {
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_limit burst=30 nodelay;

        try_files /blog/index.html =404;
    }

    location /blog/ {
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_limit burst=30 nodelay;

        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        auth_basic "Private";
        alias /var/www/blog/assets/;
    }

    location ^~ /blog/assets/ {
        auth_basic off;
    }

    location ^~ /blog/wishlist {
        auth_basic off;
        try_files $uri $uri/index.html =404;
    }

    location = /occ/first-time-guest {
        auth_basic "Occ Private";
        auth_basic_user_file /etc/nginx/.htpasswd-occ;

        limit_req zone=auth_limit burst=30 nodelay;

        return 308 $scheme://$host/occ/first-time-guest/$is_args$args;
    }

    location /occ/first-time-guest/ {
        auth_basic "Occ Private";
        auth_basic_user_file /etc/nginx/.htpasswd-occ;

        limit_req zone=auth_limit burst=30 nodelay;

        proxy_pass http://api:8000/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
