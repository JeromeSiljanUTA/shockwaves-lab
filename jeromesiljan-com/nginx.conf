# cloudflared reaches nginx over the Docker network; trust that hop so
# $remote_addr is the Cloudflare client address, not the tunnel container.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.176.0/20;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

log_format json_access escape=json
  '{'
    '"time_iso8601":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request_method":"$request_method",'
    '"uri":"$uri",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"host":"$host",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"x_forwarded_for":"$http_x_forwarded_for"'
  '}';

access_log /var/log/nginx/auth.log json_access;
error_log /var/log/nginx/error.log warn;

server {
    listen 8099;

    root /var/www;

    location = /blog {
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_limit burst=30 nodelay;

        try_files /blog/index.html =404;
    }

    location /blog/ {
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=auth_limit burst=30 nodelay;

        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        auth_basic "Private";
        alias /var/www/blog/assets/;
    }

    location ^~ /blog/assets/ {
        auth_basic off;
    }

    location ^~ /blog/wishlist {
        auth_basic off;
        try_files $uri $uri/index.html =404;
    }

    location = /occ/first-time-guest {
        auth_basic "Occ Private";
        auth_basic_user_file /etc/nginx/.htpasswd-occ;

        limit_req zone=auth_limit burst=30 nodelay;

        return 308 $scheme://$host/occ/first-time-guest/$is_args$args;
    }

    location /occ/first-time-guest/ {
        auth_basic "Occ Private";
        auth_basic_user_file /etc/nginx/.htpasswd-occ;

        limit_req zone=auth_limit burst=30 nodelay;

        proxy_pass http://api:8000/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
