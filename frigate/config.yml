# Frigate config — Shockwave's Lab
#
# Camera is an Android phone running LensCast (https://github.com/raulshma/lenscast),
# which serves proper RTSP/H.264 alongside the MJPEG web stream. We use the RTSP
# streams, not MJPEG: MJPEG can't use NVDEC and forces the UI onto Frigate's
# low-bandwidth jsmpeg path.
#
#   main  rtsp://192.168.10.146:8554/stream  1280x720 H.264+AAC  -> record
#   sub   rtsp://192.168.10.146:8554/sub     640x480  H.264      -> detect
#
# Both are landscape regardless of phone orientation; mount the phone
# landscape, or accept the aspect-fill if you leave it portrait.

# nginx (NEMESIS) terminates TLS and proxies plain HTTP to 8971. Frigate
# generates and serves a self-signed cert on 8971 by default, which makes that
# proxy return "400 The plain HTTP request was sent to HTTPS port". Disable
# Frigate-side TLS to match every other service's proxy pattern.
tls:
  enabled: false

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  # If you add auth to mosquitto, set user/password here, or reference the
  # frigate secrets env file. Do NOT commit credentials.

go2rtc:
  streams:
    # go2rtc restreams the main RTSP feed so the browser live view is MSE/H.264
    # instead of the jsmpeg MJPEG fallback. LensCast negotiates RTP over TCP
    # (interleaved), so force tcp. The /sub stream is intentionally not used:
    # LensCast fixed-encodes it at 640x480 landscape and aspect-fills the
    # portrait sensor onto it, which produces green/black bars.
    camera:
      - rtsp://192.168.10.146:8554/stream#transport=tcp

ffmpeg:
  hwaccel_args: preset-nvidia

detectors:
  # TensorRT on the NVIDIA card. Frigate builds the .trt model on first start
  # from the YOLO_MODELS env var (see docker-compose.yml). Using the ONNX
  # detector here would require an .onnx file that Frigate never downloads.
  tensorrt:
    type: tensorrt
    device: 0

model:
  path: /config/model_cache/tensorrt/yolov7-320.trt
  labelmap_path: /labelmap/coco-80.txt
  input_tensor: nchw
  input_pixel_format: rgb
  width: 320
  height: 320

objects:
  track:
    - person
    - car
    - dog
    - cat

cameras:
  camera:
    ffmpeg:
      output_args:
        # Lenscast sends AAC, so copy the audio into recordings.
        record: preset-record-generic-audio-copy
      inputs:
        # Main stream serves both roles. detect.width/height below downscale it
        # for the detector; Frigate does this itself, no second phone encode.
        - path: rtsp://127.0.0.1:8554/camera
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
    detect:
      enabled: true
      # 1280x720 is the main stream's native size. Keep the aspect ratio equal
      # to the stream's or the overlay/UI stretches.
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      motion:
        days: 3
      alerts:
        retain:
          days: 14
          mode: motion
      detections:
        retain:
          days: 14
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 14
    # Live view uses the main go2rtc stream (MSE/H.264) rather than MJPEG.
    live:
      streams:
        Main Stream: camera
