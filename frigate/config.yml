# Frigate config — Shockwave's Lab
#
# Camera is an Android phone running LensCast (https://github.com/raulshma/lenscast).
# It offers two outputs:
#
#   MJPEG  http://192.168.10.146:8080/stream   720x960 true portrait   <- used
#   RTSP   rtsp://192.168.10.146:8554/stream   landscape-only encoder
#
# We use MJPEG because the RTSP encoder in LensCast is fixed to landscape
# (640x480/1280x720/1920x1080) and stretches the portrait sensor into that
# canvas. MJPEG is the raw camera frame, so it stays portrait. Costs: CPU
# decode (no NVDEC) and recordings are re-encoded rather than copied.
#
# Object detection is unaffected -- the TensorRT detector runs on decoded
# frames regardless of the source codec.

# nginx (NEMESIS) terminates TLS and proxies plain HTTP to 8971. Frigate
# generates and serves a self-signed cert on 8971 by default, which makes that
# proxy return "400 The plain HTTP request was sent to HTTPS port". Disable
# Frigate-side TLS to match every other service's proxy pattern.
tls:
  enabled: false

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  # If you add auth to mosquitto, set user/password here, or reference the
  # frigate secrets env file. Do NOT commit credentials.

go2rtc:
  streams:
    # LensCast's RTSP encoder is landscape-only (640x480/1280x720/1920x1080) and
    # stretches the portrait sensor into that canvas, so RTSP can't give us a
    # portrait image. The MJPEG web stream is the raw camera frame -- true
    # portrait -- so we use it instead.
    #
    # MJPEG is not H.264, so go2rtc must transcode it: the ffmpeg: prefix plus
    # #video=h264 is required for the restream to be usable at all, and
    # #hardware puts the encode on the NVIDIA card. Without these, MSE live
    # view fails after its startup timeout and drops to jsmpeg (the lag).
    # Note: ffmpeg.hwaccel_args below does NOT cover this -- it only applies to
    # Frigate's own detect/record processes, not go2rtc's transcodes.
    camera:
      - "ffmpeg:http://192.168.10.146:8080/stream#video=h264#hardware"

ffmpeg:
  hwaccel_args: preset-nvidia

detectors:
  # TensorRT on the NVIDIA card. Frigate builds the .trt model on first start
  # from the YOLO_MODELS env var (see docker-compose.yml).
  tensorrt:
    type: tensorrt
    device: 0

model:
  path: /config/model_cache/tensorrt/yolov7-320.trt
  labelmap_path: /labelmap/coco-80.txt
  input_tensor: nchw
  input_pixel_format: rgb
  width: 320
  height: 320

objects:
  track:
    - person
    - car
    - dog
    - cat

cameras:
  camera:
    ffmpeg:
      output_args:
        # MJPEG source has no audio, so plain generic recording (video is
        # re-encoded to H.264 by the restream/record path).
        record: preset-record-generic
      inputs:
        # Single input from the go2rtc restream serves both roles.
        - path: rtsp://127.0.0.1:8554/camera
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
    detect:
      enabled: true
      # True portrait frame from LensCast's MJPEG stream (720x960), unlike the
      # landscape RTSP encoder output.
      width: 720
      height: 960
      fps: 5
    record:
      enabled: true
      motion:
        days: 3
      alerts:
        retain:
          days: 14
          mode: motion
      detections:
        retain:
          days: 14
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 14
    # Live view comes from the go2rtc restream of the MJPEG source. MJPEG has
    # no H.264 to restream, so the UI uses the jsmpeg path rather than MSE.
    live:
      streams:
        Main Stream: camera
