# Frigate config — Shockwave's Lab
#
# Camera is an Android phone running an IP camera app, exposing a 720x720
# MJPEG stream at http://192.168.10.146:4444/video/mjpeg.
#
# MJPEG means no NVDEC (decoded on CPU) and recordings are re-encoded rather
# than copied. Object detection is unaffected -- the TensorRT detector runs on
# decoded frames regardless of the source codec.

# nginx (NEMESIS) terminates TLS and proxies plain HTTP to 8971. Frigate
# generates and serves a self-signed cert on 8971 by default, which makes that
# proxy return "400 The plain HTTP request was sent to HTTPS port". Disable
# Frigate-side TLS to match every other service's proxy pattern.
tls:
  enabled: false

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  # If you add auth to mosquitto, set user/password here, or reference the
  # frigate secrets env file. Do NOT commit credentials.

go2rtc:
  streams:
    # Android IP Camera app (port 4444), 720x720 @ 25fps MJPEG.
    #
    # MJPEG is not H.264, so go2rtc must transcode it: the ffmpeg: prefix plus
    # #video=h264 is required for the restream to be usable at all, and
    # #hardware puts the encode on the NVIDIA card. Without these, MSE live
    # view fails after its startup timeout and drops to jsmpeg (the lag).
    # Note: ffmpeg.hwaccel_args below does NOT cover this -- it only applies to
    # Frigate's own detect/record processes, not go2rtc's transcodes.
    android:
      - "ffmpeg:http://192.168.10.146:4444/video/mjpeg#video=h264#hardware"

ffmpeg:
  hwaccel_args: preset-nvidia

detectors:
  # TensorRT on the NVIDIA card. Frigate builds the .trt model on first start
  # from the YOLO_MODELS env var (see docker-compose.yml).
  tensorrt:
    type: tensorrt
    device: 0

model:
  path: /config/model_cache/tensorrt/yolov7-320.trt
  labelmap_path: /labelmap/coco-80.txt
  input_tensor: nchw
  input_pixel_format: rgb
  width: 320
  height: 320

objects:
  track:
    - person
    - car
    - dog
    - cat

cameras:
  android:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: rtsp://127.0.0.1:8554/android
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
    detect:
      enabled: true
      # Square frame from the Android IP Camera app's MJPEG stream.
      width: 720
      height: 720
      fps: 5
    record:
      enabled: true
      motion:
        days: 3
      alerts:
        retain:
          days: 14
          mode: motion
      detections:
        retain:
          days: 14
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 14
    live:
      # Live view comes from the go2rtc restream, which transcodes the MJPEG
      # source to H.264 so MSE works instead of falling back to jsmpeg.
      streams:
        Main Stream: android
