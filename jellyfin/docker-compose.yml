services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host
    user: 1000:1000

    devices:
      - nvidia.com/gpu=all

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility

    volumes:
      - ../volumes/config:/config
      - ../volumes/cache:/cache
      - ../volumes/media:/media

    restart: unless-stopped
