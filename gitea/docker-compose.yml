services:
    server:
      image: gitea/gitea:latest-rootless
      ports:
        - "3001:3000"
        - "2222:2222"
      environment:
        # Gitea's egress policy: lax keeps public hosts allowed and only
        # consults ALLOWED_HOST_LIST for private targets. Pin the Woodpecker
        # webhook target (ci.nemesis.home.arpa -> 192.168.10.10:80) instead of
        # opening the whole `private` range. Setting EGRESS_MODE explicitly
        # also silences the "default lax mode" config-check warning.
        - GITEA__security__EGRESS_MODE=lax
        - GITEA__security__ALLOWED_HOST_LIST=192.168.10.10:80
      volumes:
        - ../../volumes/gitea/data:/var/lib/gitea
        - ../../volumes/gitea/config:/etc/gitea
        - /etc/timezone:/etc/timezone:ro
        - /etc/localtime:/etc/localtime:ro

      restart: always
