services:
    server:
      image: gitea/gitea:latest-rootless

      ports:
        - "3001:3000"
        - "2222:2222"

      volumes:
        - ../../volumes/gitea/data:/var/lib/gitea
        - ../../volumes/gitea/config:/etc/gitea
        - /etc/timezone:/etc/timezone:ro
        - /etc/localtime:/etc/localtime:ro

      restart: always
