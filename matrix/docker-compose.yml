services:
    synapse:
      image: matrixdotorg/synapse:latest
      container_name: synapse
      # run as jerome (host uid:gid) so config/data files stay editable on the host
      user: "1000:100"

      environment:
        - TZ=America/Chicago

      ports:
        - "0.0.0.0:8008:8008"

      # all persistent state lives in ../../volumes/matrix/data (bind mount)
      volumes:
        - ../../volumes/matrix/data:/data

      # authoritative logs are written to ../../volumes/matrix/data/logs; cap Docker's copy
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"

      restart: unless-stopped
