services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    # run as jerome (host uid:gid) so config/data files stay editable on the host
    user: "1000:100"
    environment:
      - TZ=America/Chicago
    # all persistent state lives in ../volumes/data (bind mount)
    volumes:
      - ../volumes/data:/data
    # authoritative logs are written to ../volumes/data/logs; cap Docker's copy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:8008:8008"
