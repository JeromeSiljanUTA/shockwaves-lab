# Deploy changed services on NEMESIS.
#
# Runs on the host via Woodpecker's `local` backend as the unprivileged
# `woodpecker` user. The deploy clone is group-owned (group `shockwaves`, which
# both `woodpecker` and `jerome` belong to) and setgid, so either can edit it
# without sudo. Only the container recreate needs root, and that is delegated to
# a root-owned wrapper that takes no arguments and only runs `make restart`.
#
# Flow:
#   1. Detect which top-level service dirs changed in this push.
#   2. Update the deploy clone (/iacon/containers/shockwaves-lab) to the exact
#      commit that triggered this pipeline (unprivileged; shared ownership).
#   3. Write the changed-service list to /var/lib/woodpecker/deploy-services.
#   4. `sudo /run/woodpecker/docker-deploy` (no args) runs
#      `make restart SERVICE=<svc>` for each.
#
# No rsync / no cross-user copying: git owns the tree and its permissions.
when:
  event: [push, manual]
  branch: master

steps:
  deploy:
    image: bash
    commands:
      - |
        set -eu
        umask 002
        repo="/iacon/containers/shockwaves-lab"
        remote="http://git.nemesis.home.arpa/jerome/shockwaves-lab"
        list="/var/lib/woodpecker/deploy-services"

        # 1. Services to (re)deploy. A manual run may pass SERVICE="a b";
        #    otherwise detect the top-level dirs changed by this push.
        if [ -n "${SERVICE:-}" ]; then
          changed=$(printf '%s\n' "$SERVICE" | tr ' ' '\n' | sort -u)
        else
          changed=$(printf '%s' "$CI_PIPELINE_FILES" \
            | grep -oE '"[^"]+/[^"]+"' \
            | tr -d '"' \
            | cut -d/ -f1 \
            | sort -u)
        fi
        [ -n "$changed" ] || { echo "no service changes"; exit 0; }

        # 2. Move the deploy clone to the triggering commit. The token is
        #    supplied via GIT_ASKPASS so it never appears in argv. The clone is
        #    group-owned (shockwaves) with setgid, and core.sharedRepository
        #    keeps files group-writable so jerome can edit without sudo.
        export GIT_TERMINAL_PROMPT=0
        if [ -n "${DEPLOY_GIT_TOKEN:-}" ]; then
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) echo %s ;; esac\n' \
            "$DEPLOY_GIT_TOKEN" > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
        fi

        if [ -d "$repo/.git" ]; then
          cd "$repo"
          git fetch --prune origin
        else
          # First run: clone into the (already existing, group-writable) dir.
          git clone "$remote" "$repo"
          cd "$repo"
          git config core.sharedRepository group
        fi
        git reset --hard "$CI_COMMIT_SHA"

        # 3. Record the changed services (wrapper re-validates each name).
        : > "$list"
        for svc in $changed; do
          [ -f "$repo/$svc/docker-compose.yml" ] || continue
          printf '%s\n' "$svc" >> "$list"
        done
        [ -s "$list" ] || { echo "no deployable services changed"; exit 0; }

        # 4. Recreate via the scoped, no-argument root wrapper.
        /run/wrappers/bin/sudo /run/woodpecker/docker-deploy
