services:
    homeassistant:
      image: "ghcr.io/home-assistant/home-assistant:stable"
      container_name: homeassistant
      privileged: true
      network_mode: host

      volumes:
        - ../../volumes/home-assistant/config:/config
        - /etc/localtime:/etc/localtime:ro
        - /run/dbus:/run/dbus:ro

      # ports:
      #   - "8123:8123"

      restart: unless-stopped
