services:
    app:
      image: ghcr.io/hargata/lubelogger:latest

      ports:
        - 8084:8080

      volumes:
        - ../../volumes/lube-logger/data:/App/data
        - ../../volumes/lube-logger/keys:/root/.aspnet/DataProtection-Keys

      env_file:
        - config.env

      restart: unless-stopped
